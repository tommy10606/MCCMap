// Modified for MCCMap: Paper-only support and a read-only website (2026).
plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' apply false
    id 'java'
}
allprojects {
    group = 'org.mccdevelopment'
    version = '1.0.1'
    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.codemc.org/repository/maven-public/' }
    }
}
ext.globals = [buildNumber: 'paper26.3']
subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'
    java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'junit:junit:4.13.2'
        testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    configurations.configureEach { exclude group: 'org.hamcrest', module: 'hamcrest-core' }
    dependencies {
        testImplementation 'org.hamcrest:hamcrest:3.0'
        constraints {
            testImplementation 'net.bytebuddy:byte-buddy:1.18.17'
            testImplementation 'net.bytebuddy:byte-buddy-agent:1.18.17'
            testImplementation 'org.objenesis:objenesis:3.6'
            testImplementation 'org.apache.commons:commons-lang3:3.21.0'
            testImplementation 'commons-codec:commons-codec:1.23.0'
            testImplementation 'org.slf4j:slf4j-api:2.0.20'
            testImplementation 'org.slf4j:jcl-over-slf4j:2.0.20'
            testImplementation 'org.yaml:snakeyaml:2.7'
        }
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
}
clean { delete 'target' }
