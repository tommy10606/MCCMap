# Modified for MCCMap: Paper-only support and a read-only website (2026).
name: Build Paper plugin
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew :paper:shadowJar :paper:test :DynmapCore:test
      - run: node --test DynmapCore/src/test/js/*.test.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: MCCMap
          path: target/MCCMap-*-paper.jar
