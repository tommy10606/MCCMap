// Modified for MCCMap: Paper-only support and a read-only website (2026).
description = "DynmapCore"

apply plugin: 'eclipse'

eclipse {
    project {
        name = "Dynmap(DynmapCore)"
    }
}


dependencies {
    implementation project(':DynmapCoreAPI')
    implementation 'org.eclipse.jetty.toolchain:jetty-servlet-api:4.0.9'
    implementation 'org.eclipse.jetty:jetty-server:12.1.14'
    implementation 'org.eclipse.jetty.ee8:jetty-ee8-nested:12.1.14'
    implementation('com.googlecode.json-simple:json-simple:1.1.1') { exclude group: 'junit' }
    implementation 'org.yaml:snakeyaml:2.7'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20261103.2'
    constraints {
        implementation 'org.slf4j:slf4j-api:2.0.20'
    }
    // Test dependencies
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

processResources {
    inputs.property('pluginVersion', project.version.toString())
    inputs.property('buildNumber', project.parent.ext.globals.buildNumber)
    // replace stuff in mcmod.info, nothing else
    filesMatching([
        'core.yml',
        'lightings.txt',
        'perspectives.txt',
        'shaders.txt',
        'extracted/web/version.js',
        'extracted/web/index.html',
    ]) {
        // replace version and mcversion
        expand(
                buildnumber: project.parent.ext.globals.buildNumber,
                version: project.version
        )
    }
}

jar {
   archiveClassifier = 'unshaded'
}

shadowJar {
    dependencies {
        include(dependency('com.googlecode.json-simple:json-simple:'))
        include(dependency('org.yaml:snakeyaml:'))
        include(dependency('com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:'))
        include(dependency('org.eclipse.jetty.toolchain:jetty-servlet-api:'))
        include(dependency('org.eclipse.jetty:.*:.*'))
        include(dependency('org.eclipse.jetty.ee8:jetty-ee8-nested:'))
        include(dependency(':DynmapCoreAPI'))
        exclude("META-INF/maven/**")
        exclude("META-INF/services/**")
    }
    relocate('org.json.simple', 'org.dynmap.json.simple')
    relocate('org.yaml.snakeyaml', 'org.dynmap.snakeyaml')
    relocate('org.eclipse.jetty', 'org.mccmap.jetty')
    relocate('org.owasp.html', 'org.dynmap.org.owasp.html')
    relocate('javax.servlet', 'org.dynmap.javax.servlet' )

    destinationDirectory = file '../target'
    archiveClassifier = ''
}

artifacts {
    archives shadowJar
}
