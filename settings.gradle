// Modified for MCCMap: Paper-only support and a read-only website (2026).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}
rootProject.name = 'MCCMap'
include 'paper', 'bukkit-helper', 'dynmap-api', 'DynmapCore', 'DynmapCoreAPI'
