// Modified for MCCMap: Paper-only support and a read-only website (2026).

description = 'Paper-only mapping plugin'

eclipse {
    project {
        name = "MCCMap(Paper)"
    }
}

repositories {
    maven { url 'https://maven.enginehub.org/repo/' }
    maven {
        url 'https://repo.codemc.org/repository/maven-releases/'
    }
}



dependencies {
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.21') { transitive = false }
    compileOnly('com.sk89q.worldguard:worldguard-core:7.0.21') { transitive = false }
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.6') { transitive = false }
    compileOnly('com.sk89q.worldedit:worldedit-core:7.4.6') { transitive = false }
    testImplementation('com.sk89q.worldguard:worldguard-core:7.0.21') { transitive = false }
    testImplementation('com.sk89q.worldedit:worldedit-core:7.4.6') { transitive = false }
    testImplementation('com.sk89q.worldedit.worldedit-libs:core:7.4.6') { transitive = false }
    testImplementation('net.skinsrestorer:skinsrestorer-api:15.12.6') { transitive = false }
    testRuntimeOnly 'com.google.code.gson:gson:2.15.0'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.253-stable'
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'
    compileOnly('net.luckperms:api:5.5')  { transitive = false }
    compileOnly('net.skinsrestorer:skinsrestorer-api:15.12.6')  { transitive = false }
    implementation(project(":dynmap-api"))  { transitive = false }
    implementation(project(path: ":DynmapCore", configuration: "shadow"))  { transitive = false }
    implementation(project(':bukkit-helper')) {
        transitive = false
    }
}

processResources {
    inputs.property('pluginVersion', project.version.toString())
    inputs.property('buildNumber', project.parent.ext.globals.buildNumber)
    // replace stuff in mcmod.info, nothing else
    filesMatching('plugin.yml') {
        // replace version and mcversion
        expand(
                buildnumber: project.parent.ext.globals.buildNumber,
                version: project.version
        )
    }
}

jar {
    archiveClassifier = 'unshaded'
}

shadowJar {
    dependencies {
        include(dependency(':dynmap-api'))
        include(dependency(":DynmapCore"))
        include(dependency(':bukkit-helper'))
    }
    manifest { attributes('paperweight-mappings-namespace': 'mojang') }
    from(rootProject.file('LICENSE'))
    from(rootProject.file('NOTICE'))
    from(rootProject.file('BOUNCY-CASTLE-LICENSE.txt'))
    destinationDirectory = file '../target'
    archiveBaseName = "MCCMap"
    archiveClassifier = 'paper'
}
shadowJar.doLast {
    task ->
        ant.checksum file: task.archiveFile.get().asFile
}

artifacts {
    archives shadowJar
}

// Test the player-event boundary against the pinned Paper API.
test { useJUnitPlatform() }
